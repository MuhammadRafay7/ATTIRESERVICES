<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Institutional mark: squared meridian, matching Logo.tsx.
       Detail is kept coarse so it still reads at 16px in a browser tab.
       The old mark mixed a gold circle with a serif "M" — both belonged to
       the previous identity and neither survived at favicon size. -->
  <rect width="64" height="64" fill="#0a1a2b"/>
  <g fill="none" stroke="#ffffff" stroke-width="3.5">
    <rect x="14" y="14" width="36" height="36"/>
    <path d="M14 32h36"/>
  </g>
  <path d="M32 14c5 5.4 7.6 11.6 7.6 18S37 44.6 32 50c-5-5.4-7.6-11.6-7.6-18S27 19.4 32 14Z"
        fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.5"/>
  <rect x="27.5" y="27.5" width="9" height="9" fill="#a9873f"/>
</svg>
